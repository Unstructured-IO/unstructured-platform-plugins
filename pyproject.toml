[project]
name = "unstructured_platform_plugins"
description = "Wrapper to convert arbitrary code into a uvicorn/fastapi implementation for Unstructured Platform"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
dependencies = [
    "requests",
    "click",
    "uvicorn",
    "fastapi",
    "click",
    "unstructured-ingest",
    "utic-invocation-settings>=0.5.0,<1.0.0",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-grpc",
    "dataclasses-json"
]
dynamic = [
 "version",
]

[tool.hatch.version]
path = "unstructured_platform_plugins/__version__.py"

[dependency-groups]
release = [
    "twine",
    "wheel",
    "build"
]
lint = [
    "ruff",
]
test = [
    "pytest",
    "httpx",
    "pytest-cov"
]

[project.scripts]
etl-uvicorn = "unstructured_platform_plugins.etl_uvicorn.main:cmd"
etl-validate = "unstructured_platform_plugins.validate_api:validate_api"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.report]
# TODO: improve this
fail_under = 15

[tool.hatch.build.targets.wheel]
    packages = ["/unstructured_platform_plugins"]

[tool.hatch.build.targets.sdist]
    packages = ["/unstructured_platform_plugins"]

[tool.uv.sources]
# Temporary source pin until v2-capable utic-invocation-settings 0.5.0 is published.
utic-invocation-settings = { git = "https://github.com/Unstructured-IO/utic-public-libs", subdirectory = "libs/utic-invocation-settings", rev = "98819b0bf9ef4a62fbbdeeed382c2dfea4937a2b" }
